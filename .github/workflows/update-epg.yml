name: Update EPG

# 每 12 小时抓取一次 DirecTV EPG，并把最新的 directv_epg.xml.gz 提交回仓库。
# 不上传到远程 paste 服务（不使用 --upload）。
on:
  # ⏸️ 定时触发已禁用。需要时取消下面两行注释即可恢复每 12 小时自动运行。
  # schedule:
  #   - cron: "0 0,12 * * *"   # 每天 00:00 与 12:00 (UTC)，即每 12 小时
  workflow_dispatch: {}  # 允许在 Actions 页面手动触发

# 允许工作流把生成的 .gz 提交回仓库
permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build-epg:
    runs-on: ubuntu-latest
    # ~200 个 ZIP 的完整抓取耗时较长，放宽超时上限（GitHub 允许最大 360 分钟）。
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch EPG (all regions, 3 days) and gzip
        run: |
          # --sleep 增大请求间延迟以温和限速，避免压垮 DirecTV 接口
          python -u directv_epg.py -z all -d 3 --sleep 0.1

      - name: Verify output exists
        run: |
          test -f directv_epg.xml.gz
          ls -la directv_epg.xml.gz
          gzip -t directv_epg.xml.gz && echo "gzip integrity OK"

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # directv_epg.xml.gz 被 .gitignore 忽略，需要 -f 强制加入
          git add -f directv_epg.xml.gz
          if git diff --cached --quiet; then
            echo "No changes in EPG output; nothing to commit."
          else
            git commit -m "chore: update EPG $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
