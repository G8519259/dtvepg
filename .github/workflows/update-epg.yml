name: Update EPG

# 每 12 小时抓取一次 DirecTV EPG，并把最新的 directv_epg.xml.gz 提交回仓库。
# 不上传到远程 paste 服务（不使用 --upload）。
on:
  schedule:
    # 每天 00:00 与 12:00 (UTC) 各运行一次，即每 12 小时
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}  # 允许在 Actions 页面手动触发

# 允许工作流把生成的 .gz 提交回仓库
permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch EPG (all regions, 3 days) and gzip
        run: |
          python directv_epg.py -z all -d 3

      - name: Verify output exists
        run: |
          test -f directv_epg.xml.gz
          ls -la directv_epg.xml.gz
          gzip -t directv_epg.xml.gz && echo "gzip integrity OK"

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # directv_epg.xml.gz 被 .gitignore 忽略，需要 -f 强制加入
          git add -f directv_epg.xml.gz
          if git diff --cached --quiet; then
            echo "No changes in EPG output; nothing to commit."
          else
            git commit -m "chore: update EPG $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
