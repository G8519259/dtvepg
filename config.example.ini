# DirecTV EPG 配置示例文件
# 复制本文件为 config.ini 并填入真实值：
#   cp config.example.ini config.ini
# config.ini 已被 .gitignore 忽略，不会提交到仓库。

[upload]
# 上传目标 paste 服务地址（含 paste id 与 admin token）。
# 等价 curl:
#   curl -u USER:PASS -X PUT -Fc=@directv_epg.xml.gz URL
url = https://pb.example.com/PASTE_ID:ADMIN_TOKEN

# HTTP Basic Auth 凭据
username = your_username
password = your_password

# 可选：Telegram 通知。填入 bot_token 与 chat_id 后，
# 每次生成 EPG 完成会推送一条包含频道数/节目数等信息的消息。
# 留空或删除本段则不发送通知。
[telegram]
bot_token = 123456789:AAExampleBotTokenReplaceMe
chat_id = 123456789
